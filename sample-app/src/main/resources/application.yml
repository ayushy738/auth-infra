spring:
  application:
    name: sample-app
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

engine:
  security:
    jwt-secret: "my-super-secret-key-which-must-be-very-long-my-super-secret-key-which-must-be-very-long"
    jwt-expiration-ms: 3600000
